<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Uploader</title>
    <style>
        :root {
            --primary-color: #0366d6;
            --secondary-color: #f6f8fa;
            --border-color: #e1e4e8;
            --text-color: #24292e;
            --success-color: #28a745;
            --error-color: #d73a49;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        body {
            background-color: #fafbfc;
            color: var(--text-color);
            line-height: 1.5;
            padding: 10px;
            margin: 0;
        }
        
        .container {
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .file-upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 4px;
            padding: 30px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background-color: var(--secondary-color);
            margin-bottom: 15px;
        }
        
        .file-upload-area:hover {
            border-color: var(--primary-color);
        }
        
        .file-upload-area.dragover {
            border-color: var(--primary-color);
            background-color: rgba(3, 102, 214, 0.05);
        }
        
        .file-list {
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 15px;
        }
        
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        
        .file-item:last-child {
            border-bottom: none;
        }
        
        .file-name {
            flex-grow: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .file-size {
            color: #6a737d;
            font-size: 12px;
            margin-left: 8px;
        }
        
        .remove-file {
            background: none;
            border: none;
            color: var(--error-color);
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
        }
        
        .progress-container {
            margin: 10px 0;
            display: none;
        }
        
        .progress-bar {
            height: 6px;
            background-color: var(--secondary-color);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 5px;
        }
        
        .progress {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s;
        }
        
        .progress-text {
            font-size: 11px;
            color: #6a737d;
            text-align: center;
        }
        
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        
        button:hover {
            background-color: #0256b9;
        }
        
        button:disabled {
            background-color: #8fa8c9;
            cursor: not-allowed;
        }
        
        .status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 4px;
            display: none;
            font-size: 14px;
        }
        
        .status.success {
            background-color: rgba(40, 167, 69, 0.1);
            border: 1px solid var(--success-color);
            color: var(--success-color);
            display: block;
        }
        
        .status.error {
            background-color: rgba(215, 58, 73, 0.1);
            border: 1px solid var(--error-color);
            color: var(--error-color);
            display: block;
        }
        
        .auto-copy-notification {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: var(--success-color);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            display: none;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            font-size: 12px;
            max-width: 200px;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="auto-copy-notification" id="auto-copy-notification">
        Link copied to clipboard!
    </div>
    
    <div class="container">
        <div class="file-upload-area" id="file-upload-area">
            <p>Drag & drop files here or click to select</p>
            <p><small>Maximum file size: 25MB</small></p>
        </div>
        <div class="file-list" id="file-list"></div>
        
        <div class="progress-container" id="progress-container">
            <div class="progress-bar">
                <div class="progress" id="progress-bar"></div>
            </div>
            <div class="progress-text" id="progress-text">Uploading...</div>
        </div>
        
        <button id="upload-button" disabled>Upload Files</button>
        
        <div class="status" id="status"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Elements
            const fileUploadArea = document.getElementById('file-upload-area');
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.multiple = true;
            const fileList = document.getElementById('file-list');
            const uploadButton = document.getElementById('upload-button');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const status = document.getElementById('status');
            const autoCopyNotification = document.getElementById('auto-copy-notification');
            
            // File storage
            let filesToUpload = [];
            let uploadedFileLinks = [];
            
            // Base URL for generated links
            const baseUrl = "https://alisfa.github.io/2276a2218i/";
            
            // Setup file input
            fileUploadArea.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileSelect);
            
            // Drag and drop functionality
            fileUploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                fileUploadArea.classList.add('dragover');
            });
            
            fileUploadArea.addEventListener('dragleave', () => {
                fileUploadArea.classList.remove('dragover');
            });
            
            fileUploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                fileUploadArea.classList.remove('dragover');
                handleFileSelect({ target: { files: e.dataTransfer.files } });
            });
            
            // Upload button click handler
            uploadButton.addEventListener('click', uploadFiles);
            
            // Handle file selection
            function handleFileSelect(e) {
                const files = Array.from(e.target.files);
                
                // Check file sizes (GitHub API limit is 25MB)
                const oversizedFiles = files.filter(file => file.size > 25 * 1024 * 1024);
                if (oversizedFiles.length > 0) {
                    alert(`The following files exceed GitHub's 25MB limit:\n${oversizedFiles.map(f => f.name).join('\n')}`);
                    // Filter out oversized files
                    const validFiles = files.filter(file => file.size <= 25 * 1024 * 1024);
                    filesToUpload = [...filesToUpload, ...validFiles];
                } else {
                    filesToUpload = [...filesToUpload, ...files];
                }
                
                renderFileList();
                updateUploadButton();
            }
            
            // Render the file list
            function renderFileList() {
                fileList.innerHTML = '';
                
                filesToUpload.forEach((file, index) => {
                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    
                    const fileName = document.createElement('span');
                    fileName.className = 'file-name';
                    fileName.textContent = file.name;
                    
                    const fileSize = document.createElement('span');
                    fileSize.className = 'file-size';
                    fileSize.textContent = formatFileSize(file.size);
                    
                    const removeButton = document.createElement('button');
                    removeButton.className = 'remove-file';
                    removeButton.innerHTML = '×';
                    removeButton.addEventListener('click', () => {
                        filesToUpload.splice(index, 1);
                        renderFileList();
                        updateUploadButton();
                    });
                    
                    fileItem.appendChild(fileName);
                    fileItem.appendChild(fileSize);
                    fileItem.appendChild(removeButton);
                    fileList.appendChild(fileItem);
                });
            }
            
            // Format file size for display
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
            
            // Update upload button state
            function updateUploadButton() {
                uploadButton.disabled = filesToUpload.length === 0;
            }
            
            // Upload files to GitHub via Netlify Function
            async function uploadFiles() {
                if (filesToUpload.length === 0) {
                    showStatus('Please select at least one file to upload', 'error');
                    return;
                }
                
                // Disable upload button and show progress
                uploadButton.disabled = true;
                progressContainer.style.display = 'block';
                status.className = 'status';
                uploadedFileLinks = [];
                
                let successCount = 0;
                let errorCount = 0;
                
                // Upload each file
                for (let i = 0; i < filesToUpload.length; i++) {
                    const file = filesToUpload[i];
                    
                    // Update progress
                    const progress = ((i / filesToUpload.length) * 100).toFixed(2);
                    progressBar.style.width = `${progress}%`;
                    progressText.textContent = `Uploading ${i+1}/${filesToUpload.length}: ${file.name}`;
                    
                    try {
                        const result = await uploadFileToGitHub(file);
                        if (result.success) {
                            successCount++;
                            // Generate and store the link
                            const fileUrl = `${baseUrl}${file.name}`;
                            uploadedFileLinks.push({
                                name: file.name,
                                url: fileUrl
                            });
                        } else {
                            errorCount++;
                        }
                    } catch (error) {
                        console.error(`Error uploading ${file.name}:`, error);
                        errorCount++;
                    }
                }
                
                // Final progress update
                progressBar.style.width = '100%';
                progressText.textContent = 'Upload complete';
                
                // Show result and send message to parent
                if (errorCount === 0) {
                    showStatus(`Successfully uploaded ${successCount} file(s)!`, 'success');
                    
                    // Send message to parent window with all uploaded URLs
                    if (uploadedFileLinks.length > 0) {
                        const urls = uploadedFileLinks.map(link => link.url);
                        sendMessageToParent({
                            type: 'uploadComplete',
                            success: true,
                            urls: urls,
                            message: `Successfully uploaded ${successCount} file(s)`
                        });
                        
                        // Auto-copy first link
                        autoCopyToClipboard(uploadedFileLinks[0].url);
                    }
                } else if (successCount === 0) {
                    const errorMessage = `Failed to upload ${errorCount} file(s)`;
                    showStatus(errorMessage, 'error');
                    sendMessageToParent({
                        type: 'uploadComplete',
                        success: false,
                        urls: [],
                        message: errorMessage
                    });
                } else {
                    const message = `Uploaded ${successCount} file(s) successfully. ${errorCount} file(s) failed.`;
                    showStatus(message, 'error');
                    
                    // Send message with successful URLs only
                    const successfulUrls = uploadedFileLinks.map(link => link.url);
                    sendMessageToParent({
                        type: 'uploadComplete',
                        success: true,
                        urls: successfulUrls,
                        message: message
                    });
                    
                    // Auto-copy first link if any were successful
                    if (uploadedFileLinks.length > 0) {
                        autoCopyToClipboard(uploadedFileLinks[0].url);
                    }
                }
                
                // Reset for next upload
                setTimeout(() => {
                    progressContainer.style.display = 'none';
                    progressBar.style.width = '0%';
                    uploadButton.disabled = false;
                    filesToUpload = [];
                    renderFileList();
                }, 3000);
            }
            
            // Upload a single file to GitHub via Netlify Function
            async function uploadFileToGitHub(file) {
                // Read file as base64
                const fileContent = await readFileAsBase64(file);
                
                // Netlify Function endpoint
                const netlifyFunctionUrl = '/.netlify/functions/upload-to-github';
                
                // Request body
                const body = {
                    path: file.name,
                    content: fileContent.split(',')[1], // Remove data URL prefix
                    message: `Upload ${file.name}`
                };
                
                // Make API request to Netlify Function
                const response = await fetch(netlifyFunctionUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });
                
                const responseData = await response.json();
                
                if (!response.ok) {
                    throw new Error(responseData.message || `HTTP ${response.status}`);
                }
                
                return { success: true, data: responseData };
            }
            
            // Send message to parent window
            function sendMessageToParent(message) {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(message, '*');
                }
                // Also log for debugging
                console.log('Message sent to parent:', message);
            }
            
            // Auto-copy to clipboard function
            function autoCopyToClipboard(text) {
                navigator.clipboard.writeText(text).then(() => {
                    // Show notification
                    autoCopyNotification.textContent = `✓ Copied: ${text.substring(0, 40)}...`;
                    autoCopyNotification.style.display = 'block';
                    
                    // Hide notification after 3 seconds
                    setTimeout(() => {
                        autoCopyNotification.style.display = 'none';
                    }, 3000);
                }).catch(err => {
                    console.error('Failed to copy automatically: ', err);
                });
            }
            
            // Read file as base64 data URL
            function readFileAsBase64(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }
            
            // Show status message
            function showStatus(message, type) {
                status.textContent = message;
                status.className = `status ${type}`;
            }
            
            // Listen for messages from parent (optional)
            window.addEventListener('message', function(event) {
                // You can handle incoming messages from parent here if needed
                console.log('Message received from parent:', event.data);
            });
        });
    </script>
</body>
</html>
